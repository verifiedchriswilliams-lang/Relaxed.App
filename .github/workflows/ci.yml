name: CI

# Merge gate for code: a production build must compile and the unit tests
# (audio levels, session timing, the breath clock, history, rate limiting,
# formatters) must pass. Runs on PRs and on pushes to main.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
